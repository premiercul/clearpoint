<!doctype html>
<html lang="en-NG">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <title>You're offline | ClearPoint</title>
    <style>
      body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #fff; color: #000; text-align: center; padding: 24px; box-sizing: border-box; }
      .box { max-width: 360px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; color: #4b5563; line-height: 1.5; margin: 0 0 20px; }
      button { background: #000; color: #fff; border: 0; border-radius: 12px; padding: 12px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="box">
      <h1>You're offline</h1>
      <p>ClearPoint needs an internet connection to load your links and payments. Check your data or Wi-Fi, then try again. Nothing you submitted has been lost.</p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
