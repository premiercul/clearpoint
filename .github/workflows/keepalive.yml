name: Keep Supabase awake

# Free Supabase projects pause after about a week with little activity.
# This calls the keepalive() database function every 6 hours. It talks to Supabase directly,
# so it works even if the website itself is down.
#
# Setup: GitHub repo -> Settings -> Secrets and variables -> Actions -> New repository secret
#   SUPABASE_URL        https://YOUR-PROJECT.supabase.co
#   SUPABASE_ANON_KEY   your anon/public key
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -u
          if [ -z "${SUPABASE_URL}" ] || [ -z "${SUPABASE_ANON_KEY}" ]; then
            echo "Add the SUPABASE_URL and SUPABASE_ANON_KEY repository secrets."
            exit 1
          fi
          for i in 1 2 3; do
            code=$(curl -s -o /tmp/out.json -w "%{http_code}" --max-time 30 -X POST \
              "${SUPABASE_URL}/rest/v1/rpc/keepalive" \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              -H "Content-Type: application/json" \
              -d '{}')
            if [ "$code" = "200" ]; then
              echo "OK: $(cat /tmp/out.json)"
              exit 0
            fi
            echo "Attempt $i failed (HTTP $code)"
            sleep 20
          done
          echo "Supabase did not respond. The project may already be paused: open the Supabase dashboard and restore it."
          exit 1
